<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>公式助手</title>
  <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
  <link rel="stylesheet" href="vendor/Temml-Latin-Modern.css" />
  <link rel="stylesheet" href="taskpane.css" />
</head>
<body>
  <div id="app">
    <main id="view-home" class="view">
      <header class="topbar" id="home-topbar">
        <div class="topbar-title">
          <img class="logo" src="/assets/icons/icon-32.png" alt="" />
          <span>公式助手</span>
        </div>
        <button id="btn-settings" class="icon-btn" aria-label="设置" title="设置">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1.11-1.55 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09a1.7 1.7 0 0 0 1.55-1.11 1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34h.08a1.7 1.7 0 0 0 1-1.55V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87v.08a1.7 1.7 0 0 0 1.55 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.55 1z"/></svg>
        </button>
      </header>

      <div id="demo-banner" class="demo-banner" hidden>
        浏览器预览模式 — 在 Word 中打开后所有功能可用
      </div>

      <div class="content">
        <nav class="segmented" id="mode-seg" aria-label="输入方式">
          <span class="seg-thumb" id="mode-thumb"></span>
          <button class="seg-btn is-active" data-mode="image" type="button">识图</button>
          <button class="seg-btn" data-mode="describe" type="button">描述</button>
        </nav>

        <section id="pane-image" class="pane">
          <div class="scope-row" id="scope-row">
            <span class="scope-label">识别范围</span>
            <div class="mini-seg" id="scope-seg" role="group" aria-label="识别范围">
              <span class="seg-thumb" id="scope-thumb"></span>
              <button data-scope="formula" type="button" class="is-active">仅公式</button>
              <button data-scope="full" type="button">全文</button>
            </div>
          </div>
          <div id="dropzone" class="dropzone" tabindex="0" role="button" aria-label="上传或粘贴图片">
            <svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3.5"/><circle cx="9" cy="9.2" r="1.8"/><path d="M21 15.2l-4.6-4.6a1.6 1.6 0 0 0-2.26 0L4.6 20.1"/></svg>
            <p class="dz-title">上传图片或按 <kbd>Ctrl</kbd>+<kbd>V</kbd> 粘贴截图</p>
            <p class="dz-sub">识别后自动转为 LaTeX 公式，也可以拖拽图片到这里</p>
          </div>
          <div id="img-preview" class="img-preview" hidden>
            <img id="preview-img" alt="待识别的公式截图" />
            <div class="img-actions">
              <button id="btn-repick" class="btn-small" type="button">重新选择</button>
              <button id="btn-remove" class="btn-small" type="button">移除</button>
              <span id="img-status" class="status-line"></span>
            </div>
          </div>
          <input type="file" id="file-input" accept="image/*" hidden />
        </section>

        <section id="pane-describe" class="pane" hidden>
          <textarea id="nl-input" class="nl-input" rows="4"
            placeholder="用自然语言描述公式，例如：&#10;y下标1等于sin x的三次方乘以cos x分之一"></textarea>
          <p class="nl-hint">按 <kbd>Enter</kbd> 生成，<kbd>Shift</kbd>+<kbd>Enter</kbd> 换行</p>
        </section>

        <section id="result" class="card result" hidden>
          <div class="result-head">
            <span class="result-title" id="result-title">识别结果</span>
            <span class="result-meta" id="result-meta"></span>
            <span class="flex-spacer"></span>
            <button id="btn-copy" class="icon-btn small" aria-label="复制 LaTeX" title="复制 LaTeX" hidden>
              <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2.5"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
            </button>
            <button id="btn-rerun" class="icon-btn small" aria-label="重新识别" title="重新识别" hidden>
              <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
            </button>
          </div>
          <div id="math-preview" class="math-preview" aria-label="公式预览"></div>
          <textarea id="latex-edit" class="latex-edit" rows="2" spellcheck="false"
            aria-label="LaTeX 源码（可编辑）"></textarea>
          <div class="insert-row">
            <span class="flex-spacer"></span>
            <button id="btn-insert" class="btn-primary" type="button">
              <span class="btn-label">插入到 Word</span>
              <span class="btn-spinner" hidden></span>
            </button>
          </div>
          <div id="insert-diag" class="diag-box" hidden>
            <div class="diag-title">插入失败诊断（请把以下各行发给开发者）</div>
            <div id="insert-diag-lines" class="diag-lines"></div>
          </div>
        </section>
      </div>

      <footer class="statsbar">
        <span id="stats-text">累计 0 tokens · 0 次请求</span>
      </footer>
    </main>

    <main id="view-settings" class="view" aria-hidden="true">
      <header class="topbar">
        <button id="btn-back" class="icon-btn" aria-label="返回" title="返回">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
        </button>
        <div class="topbar-title center">设置</div>
        <span class="icon-btn placeholder"></span>
      </header>
      <div class="content settings-body">
        <div class="field">
          <label for="cfg-provider">服务商预设</label>
          <select id="cfg-provider">
            <option value="deepseek">DeepSeek</option>
            <option value="zhipu">智谱 GLM</option>
            <option value="siliconflow">硅基流动 SiliconFlow</option>
            <option value="dashscope">阿里云百炼 Qwen</option>
            <option value="openrouter">OpenRouter</option>
            <option value="custom">自定义（OpenAI 兼容）</option>
          </select>
        </div>
        <div class="field">
          <label for="cfg-baseurl">API 地址</label>
          <input id="cfg-baseurl" type="url" placeholder="https://api.deepseek.com" />
        </div>
        <div class="field">
          <label for="cfg-key">API Key</label>
          <div class="key-row">
            <input id="cfg-key" type="password" autocomplete="off" placeholder="sk-…" />
            <button id="btn-toggle-key" class="btn-small" type="button">显示</button>
          </div>
        </div>
        <div class="field">
          <label for="cfg-vmodel">视觉模型（识图）</label>
          <input id="cfg-vmodel" type="text" placeholder="deepseek-flash" />
        </div>
        <div class="field">
          <label for="cfg-tmodel">文本模型（描述转公式）</label>
          <input id="cfg-tmodel" type="text" placeholder="deepseek-chat" />
        </div>
        <button id="btn-test" class="btn-secondary" type="button">测试连接与识图能力</button>
        <div id="test-result" class="test-result" hidden></div>
        <div class="card stats-box">
          <div class="stats-title">Token 用量</div>
          <div id="stats-detail" class="stats-detail"></div>
          <button id="btn-reset-stats" class="btn-small danger" type="button">清零统计</button>
        </div>
        <div class="card stats-box">
          <div class="stats-title">诊断信息（最近的错误，用于排查）</div>
          <div id="diag-lines" class="diag-lines"></div>
        </div>
        <p class="settings-note">API Key 仅保存在本机浏览器存储中，请求直接发往对应服务商，不经任何第三方服务器。</p>
      </div>
    </main>

    <div id="toast-host" aria-live="polite"></div>
  </div>

  <script src="vendor/temml.js"></script>
  <script src="user.config.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
