<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="480" viewBox="0 0 1280 480" role="img" aria-labelledby="title desc">
<title id="title">公式助手 — 让公式录入，像粘贴一样简单。</title><desc id="desc">截图、描述与 LaTeX，直接变成 Word 原生公式。</desc>
<defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000000" flood-opacity=".07"/></filter></defs>
<g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Microsoft YaHei,Noto Sans CJK SC,sans-serif">
<rect width="1280" height="480" rx="24" fill="#f5f5f7"/>
<rect x="64" y="50" width="34" height="34" rx="10" fill="#007aff"/><text x="81" y="75" text-anchor="middle" font-size="25" font-weight="700" fill="#ffffff">Σ</text><text x="112" y="74" font-size="20" font-weight="600" fill="#1d1d1f">Formula Copilot</text>
<text x="64" y="170" font-size="54" font-weight="700" letter-spacing="-1.4" fill="#1d1d1f">让公式录入，</text><text x="64" y="238" font-size="54" font-weight="700" letter-spacing="-1.4" fill="#1d1d1f">像粘贴一样简单。</text><text x="64" y="291" font-size="18" fill="#6e6e73">截图、描述与 LaTeX，直接变成 Word 原生公式。</text>
<rect x="64" y="356" width="128" height="38" rx="19" fill="#e8f2ff"/><text x="128" y="381" font-size="15" text-anchor="middle" fill="#007aff">截图识别</text><rect x="206" y="356" width="128" height="38" rx="19" fill="#e8f2ff"/><text x="270" y="381" font-size="15" text-anchor="middle" fill="#007aff">自然语言</text><rect x="348" y="356" width="128" height="38" rx="19" fill="#e8f2ff"/><text x="412" y="381" font-size="15" text-anchor="middle" fill="#007aff">原生可编辑</text><text x="64" y="441" font-size="13" fill="#6e6e73">WINDOWS 2.0 · MICROSOFT WORD</text>
<g filter="url(#shadow)"><rect x="772" y="46" width="444" height="388" rx="22" fill="#ffffff" stroke="#e4e4e8"/></g>
<text x="798" y="84" font-size="19" font-weight="600" fill="#1d1d1f">公式助手</text><circle cx="1183" cy="77" r="9" fill="none" stroke="#007aff" stroke-width="2"/><circle cx="1183" cy="77" r="3" fill="none" stroke="#007aff" stroke-width="2"/>
<rect x="794" y="105" width="400" height="36" rx="10" fill="#f0f0f3"/><rect x="995" y="108" width="196" height="30" rx="8" fill="#ffffff"/><text x="894" y="129" font-size="14" text-anchor="middle" fill="#6e6e73">识图</text><text x="1093" y="129" font-size="14" text-anchor="middle" font-weight="600" fill="#1d1d1f">描述</text>
<rect x="794" y="155" width="400" height="55" rx="12" fill="#f0f0f3"/><text x="812" y="188" font-size="16" fill="#1d1d1f">从 1 到无穷，1/k² 的和</text><text x="798" y="239" font-size="13" font-weight="600" fill="#6e6e73">可编辑的原生公式</text>
<g fill="#1d1d1f" font-family="Cambria Math,STIX Two Math,Times New Roman,serif"><text x="863" y="304" font-size="57">∑</text><text x="884" y="258" font-size="16" text-anchor="middle">∞</text><text x="884" y="326" font-size="15" text-anchor="middle">k = 1</text><text x="948" y="279" font-size="29" text-anchor="middle">1</text><line x1="927" y1="287" x2="969" y2="287" stroke="#1d1d1f" stroke-width="1.5"/><text x="948" y="317" font-size="29" text-anchor="middle" font-style="italic">k²</text><text x="988" y="300" font-size="34">=</text><text x="1061" y="279" font-size="29" text-anchor="middle">π²</text><line x1="1039" y1="287" x2="1083" y2="287" stroke="#1d1d1f" stroke-width="1.5"/><text x="1061" y="317" font-size="29" text-anchor="middle">6</text></g>
<rect x="1001" y="359" width="193" height="49" rx="13" fill="#007aff"/><text x="1097" y="390" font-size="16" font-weight="600" text-anchor="middle" fill="#ffffff">插入到 Word</text></g></svg>
